services:
  development:
    extends:
      file: common_compose.yml
      service: common_service
    container_name: ${IMAGE}
    image: ${IMAGE_TAG_LATEST}
    working_dir: /root/${REPOSITORY}
    network_mode: "host"
    ipc: host
    devices:
      - /dev:/dev
    security_opt:
      - seccomp:unconfined
    cap_add:
      - ALL
    environment:
      DISPLAY: $DISPLAY
      PRE_COMMIT_HOME: "/root/${REPOSITORY}/.devcontainer/cache/pre-commit"
      PIP_CACHE_DIR: "/root/${REPOSITORY}/.devcontainer/cache/pip"
    ports:
      - "8050:8050"
      - "8000:8000"
    volumes:
      - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates
      - /etc/ssl/certs:/etc/ssl/certs
      - $HOME/.ssh:/root/.ssh
      - $HOME/.gitconfig:/etc/.gitconfig
      - ..:/root/${REPOSITORY}
