services:
  testing:
    container_name: ${IMAGE}
    image: ${IMAGE_TAG}
    working_dir: /root/${REPOSITORY}
    network_mode: "host"
    privileged: true
    stdin_open: true
    ipc: host
    devices:
      - /dev:/dev
    security_opt:
      - seccomp:unconfined
    cap_add:
      - ALL
    environment:
      DISPLAY: $DISPLAY
