name: Continuous Integration and Continuous Deployment (CI/CD)
on:
  push:
    branches:
      - main
  # pull_request:
  #   branches:
  #     - '**'
  #     - '!main'
  workflow_run:
    workflows:
      - Build
    types:
      - completed

jobs:

  coverage_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch repository
        uses: actions/checkout@v4

      # - uses: actions/setup-python@v3
      #   with:
      #     python-version: '3.11'

      # - name: Install Python Packages required by Pre-commit
      #   run: python -m pip install --upgrade pip setuptools wheel

      - name: Setup Python
        uses: actions/setup-python@v5 # Upgraded to v5
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up subsequent runs

      - name: Force Pre-commit Clean
        run: |
          pip install pre-commit
          pre-commit clean

      - name: Execute Pre-commit checks
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

      - uses: ./.github/actions/initialize

      # Composite actions cannot access `secrets`
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: amizzuddin
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: BUILD and PUSH DEVELOPMENT Image to Registry
        run: |
          ./run build dev
          ./run push dev

      - name: TEST DEVELOPMENT Image
        run: |
          ./run test dev
          cat reports/test_coverage.md >> $GITHUB_STEP_SUMMARY

  integration_pipeline:
    runs-on: ubuntu-latest
    if: ${{ always() && contains(join(needs.*.result, ','), 'success') }}
    needs: coverage_pipeline
    steps:
      - name: Checkout current branch repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/initialize

      # Composite actions cannot access `secrets`
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: amizzuddin
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: BUILD PRODUCTION Image
        run: ./run build prod

      # - name: TEST PRODUCTION Image
      #   run: ./run test prod

      - name: PUSH PRODUCTION Image to Registry
        run: ./run push prod
