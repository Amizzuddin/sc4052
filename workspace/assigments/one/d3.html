<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ftree-vis D3 Replica</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f0f0; margin: 0; display: flex; }
        #sidebar { width: 300px; padding: 20px; background: white; border-right: 1px solid #ddd; height: 100vh; }
        #chart { flex-grow: 1; height: 100vh; background: #fff; }
        .node.switch { fill: #000066; stroke: #000; stroke-width: 1px; }
        .node.host { fill: #660000; }
        .link { stroke: #A0A0A0; stroke-width: 1px; opacity: 0.6; }
        .stats-item { display: flex; justify-content: space-between; margin: 10px 0; font-size: 18px; }
        input { width: 60px; float: right; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Fat Tree Visualizer</h2>
    <div class="control">
        <label>Tree Depth (h): </label>
        <input type="number" id="depth" value="3" min="1">
    </div>
    <div class="control" style="margin-top:10px;">
        <label>Ports (k): </label>
        <input type="number" id="k" value="6" min="2" step="2">
    </div>
    <hr>
    <div id="stats"></div>
</div>

<div id="chart"></div>

<script>
    const margin = {top: 50, right: 50, bottom: 50, left: 50};
    const width = window.innerWidth - 300;
    const height = window.innerHeight;

    const svg = d3.select("#chart").append("svg")
        .attr("width", width)
        .attr("height", height);

    function update() {
        svg.selectAll("*").remove();

        const h = +d3.select("#depth").property("value");
        const k = +d3.select("#k").property("value");
        const halfK = k / 2;
        const nodesPerTier = Math.pow(halfK, h - 1);

        // --- Original Mathematical Logic ---
        const nHosts = 2 * Math.pow(halfK, h);
        const nSwitches = (h + halfK - 1) * nodesPerTier;
        const nCables = h * nHosts;

        d3.select("#stats").html(`
            <div class="stats-item"><span>Hosts</span><span>${nHosts}</span></div>
            <div class="stats-item"><span>Switches</span><span>${nSwitches}</span></div>
            <div class="stats-item"><span>Cables</span><span>${nCables}</span></div>
        `);

        const nodes = [];
        const links = [];

        // 1. Generate Switches (Square Nodes)
        for (let tier = 0; tier < h; tier++) {
            for (let i = 0; i < nodesPerTier; i++) {
                const node = {
                    id: `S_${tier}_${i}`,
                    type: 'switch',
                    x: (width / (nodesPerTier + 1)) * (i + 1),
                    y: height - (height / (h + 2)) * (tier + 1.5) // Inverted Y (Core at bottom)
                };
                nodes.push(node);

                // Connect to tier above (closer to hosts)
                if (tier > 0) {
                    const podStart = Math.floor(i / halfK) * halfK;
                    for (let j = 0; j < halfK; j++) {
                        links.push({ source: node.id, target: `S_${tier - 1}_${podStart + j}` });
                    }
                }
            }
        }

        // 2. Generate Hosts (Circle Nodes at Top)
        const visHostsPerSwitch = k > 6 ? 3 : halfK; // Visual representative subset
        for (let i = 0; i < nodesPerTier; i++) {
            const parent = nodes.find(n => n.id === `S_0_${i}`);
            for (let j = 0; j < visHostsPerSwitch; j++) {
                const host = {
                    id: `H_${i}_${j}`,
                    type: 'host',
                    x: parent.x + (j - (visHostsPerSwitch-1)/2) * 20,
                    y: height - (height / (h + 2)) * (0.5)
                };
                nodes.push(host);
                links.push({ source: parent.id, target: host.id });
            }
        }

        // Draw Links
        svg.selectAll(".link")
            .data(links)
            .enter().append("line")
            .attr("class", "link")
            .attr("x1", d => nodes.find(n => n.id === d.source).x)
            .attr("y1", d => nodes.find(n => n.id === d.source).y)
            .attr("x2", d => nodes.find(n => n.id === d.target).x)
            .attr("y2", d => nodes.find(n => n.id === d.target).y);

        // Draw Switch Nodes (Squares)
        svg.selectAll(".node.switch")
            .data(nodes.filter(n => n.type === 'switch'))
            .enter().append("rect")
            .attr("class", "node switch")
            .attr("x", d => d.x - 7)
            .attr("y", d => d.y - 7)
            .attr("width", 14)
            .attr("height", 14);

        // Draw Host Nodes (Circles)
        svg.selectAll(".node.host")
            .data(nodes.filter(n => n.type === 'host'))
            .enter().append("circle")
            .attr("class", "node host")
            .attr("cx", d => d.x)
            .attr("cy", d => d.y)
            .attr("r", 4);
    }

    d3.selectAll("input").on("input", update);
    update();
</script>
</body>
</html>
